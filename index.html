	// all CDNs support this, while HEAD requests are often rejected
	function probe(u, timeout) {
		return new Promise(function(res) {
			var ctrl = window.AbortController ? new AbortController() : null;
			var t = ctrl ? setTimeout(function(){ ctrl.abort(); }, timeout) : null;
			var start = now();

			var opts = {
				method: "GET",
				cache: "no-store",
				headers: { "Range": "bytes=0-0" }
			};

			if (ctrl) opts.signal = ctrl.signal;

			realFetch.call(window, u, opts).then(function(r){
				if (t) clearTimeout(t);

				if (r.ok || r.status === 206) {
					try {
						r.body && r.body.cancel && r.body.cancel();
					} catch(e){}

					res({
						url: u,
						ms: now() - start,
						status: r.status
					});
				} else {
					res({
						url: u,
						ms: Infinity,
						err: "HTTP " + r.status
					});
				}
			}).catch(function(e){
				if (t) clearTimeout(t);

				res({
					url: u,
					ms: Infinity,
					err: (e && e.name === "AbortError")
						? "timeout"
						: ((e && e.message) || String(e))
				});
			});
		});

	// (8-second probe timeout — network latency in mainland China is relatively high)
	//
	// Important: if all probes fail, don't throw an error;
	// return null so the upper layer can perform a direct fetch
	function fastestMirror() {
		var saved = null;

		try {
			saved = JSON.parse(
				localStorage.getItem(LS_KEY) || "null"
			);
		} catch(e){}

		if (saved && saved.url && (now() - saved.ts < LS_TTL)) {
			console.log(
				"[EPW-CDN] Reusing cached best mirror (1h TTL): "
				+ shortName(saved.url)
			);

			return Promise.resolve(saved.url);
		}

			"[EPW-CDN] Probing "
			+ EPW_MIRRORS.length
			+ " mirrors in parallel (8s timeout each)..."
		);

			return probe(u, 8000).then(function(r){
				console.log(
					"[EPW-CDN]   probe ["

					+ (
						r.ms === Infinity

					)
				);

				return r;
			});
		});

			rs.sort(function(a,b){ return a.ms - b.ms; });

			var best = rs[0];

				"[EPW-CDN] Best: "
				+ shortName(best.url)
				+ " ("
				+ best.ms

					LS_KEY,
					JSON.stringify({

						ms: best.ms,

			} catch(e){}

		return bestUrlPromise || (

					var errMsg =

						+ order.length

					+ order.length

						+ (e && e.message || e)

				});
			}

			return tryMirror(0);
		});
	}

	// Check whether the cached response is complete
	// (status OK + size close to 36 MB)
	function isCacheValid(cached) {
		if (!cached) return false;

		var len = parseInt(
			cached.headers.get("Content-Length") || "0",
			10

			len > 0 &&

				+ len
				+ " mismatch expected "
				+ EXPECTED_SIZE

		}

		return true;

					fetchWithFallback(1, 60000).then(function(r) {

						console.warn(
							"[EPW-CDN] Background refresh skipped: "
							+ (e && e.message || e)
						);

					});

					return cached;
				}

				// Cache is invalid, delete the old entry
				if (cached) {
					console.warn(
						"[EPW-CDN] Cached entry invalid, deleting..."
					);

					cache.delete(CACHE_KEY).catch(function(){});
				}

				console.log(
					"[EPW-CDN] ✗ Cache MISS — downloading EPW "
					+ "from network (one-time)..."
				);

				return fetchWithFallback(2, 60000).then(function(r) {

					console.log(
						"[EPW-CDN] ✓ Download complete, storing to "
						+ "Cache API for persistent caching..."
					);

					return cache.put(
						CACHE_KEY,

					).then(function() {

						console.log(
							"[EPW-CDN] ✓ EPW cached! Next visit "
							+ "(and Ctrl+F5) will be instant."

						return r;

					}).catch(function(e) {

						console.warn(
							"[EPW-CDN] Cache put failed: "
							+ (e && e.message || e)
						);

						return r;
					});
				});
			});
		});

	window.fetch = function(input, init) {

		+ " verified mirrors, 8s probe, Cache API persistent, "
		+ "validate-on-hit, no-throw-on-probe-fail"
	);

})();
